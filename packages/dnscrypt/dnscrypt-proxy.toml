###############################################################################
#                      DNSCrypt-Proxy Configuration                           #
#                 Strict Parental Control & Ad-Blocking                       #
###############################################################################

## Servers list
## Multi-server setup (AdGuard, Control D, DNS for Family) ensuring redundancy 
## and consistent filtering of adult content, gambling, malware, trackers, ads,
## and proxy/anonymizer sites, while enforcing SafeSearch across search engines.
server_names = ['adguard-dns-family', 'controld-family-friendly', 'dnsforfamily']

## Security & Privacy Requirements
## Ensure that the selected servers support DNSSEC (cryptographic verification)
## and have a strict no-log policy.
require_dnssec = true
require_nolog = true

## Local listening ports for DNSCrypt-proxy (Android system loopback)
listen_addresses = ['127.0.0.1:55', '[::1]:55']

## Network connectivity check settings
netprobe_timeout = -1
netprobe_address = '9.9.9.9:53'

## Bootstrap resolvers
## Non-encrypted DNS resolvers used ONLY for initial bootstrapping.
## User DNS queries are NEVER routed through these once connected.
bootstrap_resolvers = ['9.9.9.11:53', '8.8.8.8:53']

###############################################################################
#                                DNS Cache                                    #
###############################################################################

## Enable internal DNS cache to improve performance and reduce latency
cache = true
cache_size = 4096
cache_min_ttl = 2400
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

###############################################################################
#                             Logging & Debugging                             #
###############################################################################

## Logging level (0: Very verbose, 3: Notice/Warnings, 6: Fatal only)
## Level 3 is recommended for Android to prevent excessive storage wear.
log_level = 3
log_file = '/data/misc/dnscrypt_proxy/dnscrypt_proxy.log'

## YouTube Restricted Mode: cloak YouTube hosts to restrict.youtube.com.
## Top-level keys, must stay above the first [section].
cloaking_rules = '/system_ext/etc/dnscrypt-proxy/cloaking-rules.txt'
cloak_ttl = 600

[query_log]
  file = '/data/misc/dnscrypt_proxy/dnscrypt_proxy_query.log'
  format = 'tsv'

[nx_log]
  file = '/dev/null'
  format = 'tsv'

###############################################################################
#                         Local Rules & Filtering                             #
###############################################################################

## Local domain blacklisting for additional custom filtering (Optional)
## Can be used to block specific domains manually, augmenting the upstream DNS.
[blocked_names]
  blocked_names_file = '/system_ext/etc/dnscrypt-proxy/blocked-names.txt'
  log_file = '/data/misc/dnscrypt_proxy/dnscrypt_proxy_blocked_names.log'

###############################################################################
#                                Sources                                      #
###############################################################################

## Enforce strict parental control lists exclusively
[sources]
 [sources.'parental-control']
   urls = [
     'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/parental-control.md',
     'https://download.dnscrypt.info/resolvers-list/v3/parental-control.md'
   ]
   cache_file = '/data/misc/dnscrypt_proxy/parental-control.md'
   minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'

## Public resolvers list is loaded ONLY because controld-family-friendly (Control D
## Family) is not part of parental-control.md. No other public resolver is used:
## server_names above restricts which servers can be selected.
 [sources.'public-resolvers']
   urls = [
     'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
     'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md'
   ]
   cache_file = '/data/misc/dnscrypt_proxy/public-resolvers.md'
   minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'

## Relays for Anonymized DNS (Disabled/Commented out to ensure direct secure connection)
#[sources.relays]